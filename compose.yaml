services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/certs:/certs:ro

  # Catches the recovery emails: SMTP for the apps (host side), web UI and API behind Caddy (/mail/).
  mailpit:
    image: axllent/mailpit:v1.33
    environment:
      MP_WEBROOT: /mail/
    ports:
      - "127.0.0.1:1025:1025"
